spring:
  application:
    name: event-polling-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:database}:5432/${DB_NAME:edger-news-db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  environment:
    fredApiKey: ${FRED_API_KEY}
server:
  port: 5001