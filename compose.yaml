services:
  frontend:
    build: ./frontend/edge-news-ui
    container_name: react_frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - VITE_API_URL=${API_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      event-service:
        condition: service_healthy
      price-service:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./frontend
          target: /code
        - action: rebuild
          path: ./frontend/package.json
  event-service:
    build: ./backend/event-service
    container_name: event-service
    ports:
      - "${EVENT_SERVICE_PORT}:5000"
    environment:
      - DB_HOST=${DB_HOST} 
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    develop:
      watch:
        - action: sync+restart
          path: ./backend/event-service
          target: /code
        - action: rebuild
          path: ./backend/event-service/pom.xml
  price-service:
    build: ./backend/price-service
    container_name: price-service
    ports:
      - "${PRICE_SERVICE_PORT}:4999"
    environment:
      - DB_HOST=${DB_HOST} 
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4999/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    develop:
      watch:
        - action: sync+restart
          path: ./backend/price-service
          target: /code
        - action: rebuild
          path: ./backend/price-service/pom.xml
  database:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
volumes:
  postgres-data:
